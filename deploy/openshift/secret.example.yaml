# Copy to secret.yaml, fill in real values, and never commit the filled-in copy.
apiVersion: v1
kind: Secret
metadata:
  name: teamdesk-secrets
type: Opaque
stringData:
  MONGO_URI: mongodb://USER:PASSWORD@mongo-0.mongo,mongo-1.mongo,mongo-2.mongo/?replicaSet=rs0
  SESSION_SECRET: replace-with-64-random-characters
  SMTP_USER: ""
  SMTP_PASSWORD: ""
