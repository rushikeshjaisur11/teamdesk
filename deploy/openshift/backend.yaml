apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamdesk-api
  labels: { app: teamdesk-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: teamdesk-api }
  template:
    metadata:
      labels: { app: teamdesk-api }
    spec:
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/teamdesk/teamdesk-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: teamdesk-config }
            - secretRef: { name: teamdesk-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: teamdesk-api
spec:
  selector: { app: teamdesk-api }
  ports: [{ port: 8080, targetPort: 8080 }]
